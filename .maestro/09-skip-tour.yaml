# QA Part B — informed-choice click-through
# B2h: skip the quick tour to land on Home.
appId: host.exp.Exponent
name: 09-skip-tour
---
- runFlow:
    when:
      visible: "Skip tour"
    commands:
      - tapOn: "Skip tour"
- extendedWaitUntil:
    visible: ".*"
    timeout: 20000
- takeScreenshot: b9-home-reached