appId: com.truejoybirthing.app
---
# TJB 10/05b credential E2E v2 (all learnings folded in): mom vocab chips + CD
# filter + Sarah's custom chips visible + midwife chip editor + session restore.
# No erase; clearKeychain+relaunch pattern; extendedWaitUntil over assertVisible.
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'I already have an account'
    timeout: 20000
- tapOn: 'I already have an account'
- waitForAnimationToEnd: {timeout: 3000}
- tapOn: {text: 'Email'}
- inputText: 'demo.mom@truejoybirthing.com'
- tapOn: {id: 'login-password-input'}
- inputText: 'DemoMom2024!'
- tapOn: {id: 'login-submit-btn'}
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    timeout: 15000
    visible: 'Hello, Emma'
- openLink: 'truejoybirthing:///(mom)/marketplace'
- waitForAnimationToEnd: {timeout: 6000}
- assertVisible: 'All Credentials'
- tapOn: 'CD'
- waitForAnimationToEnd: {timeout: 5000}
- extendedWaitUntil:
    timeout: 15000
    visible: 'Sarah Mitchell'
- takeScreenshot: tjb-cred-vocab-cd-filtered
# Sarah's card: canonical CD/CLC + her custom DONA/CAPPA chips all visible;
# "View Profile" sits below the fold on this card -> scroll to it and tap.
- scrollUntilVisible:
    element:
      text: 'View Profile'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 60
- waitForAnimationToEnd: {timeout: 3000}
- waitForAnimationToEnd: {timeout: 2000}
- tapOn: 'View Profile'
- waitForAnimationToEnd: {timeout: 5000}
- extendedWaitUntil:
    timeout: 10000
    visible: 'Credentials'
- takeScreenshot: tjb-cred-detail-chips
# --- midwife side: chip editor in profile edit
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'I already have an account'
    timeout: 20000
- tapOn: 'I already have an account'
- waitForAnimationToEnd: {timeout: 3000}
- tapOn: {text: 'Email'}
- inputText: 'demo.midwife@truejoybirthing.com'
- tapOn: {id: 'login-password-input'}
- inputText: 'DemoMidwife2024!'
- tapOn: {id: 'login-submit-btn'}
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    timeout: 15000
    visible: 'Hello, Emily'
- openLink: 'truejoybirthing:///(midwife)/profile'
- waitForAnimationToEnd: {timeout: 6000}
- scrollUntilVisible:
    element:
      text: 'Credentials'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- tapOn: 'Edit'
- waitForAnimationToEnd: {timeout: 3000}
- scrollUntilVisible:
    element:
      text: 'Credentials'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- waitForAnimationToEnd: {timeout: 2000}
- takeScreenshot: tjb-midwife-cred-editor
# quick-add: CNM sits below the fold at this scroll depth — tap the fully
# visible CPM chip, then type a custom credential and Add (custom chips stay
# verbatim by design)
- tapOn:
    id: 'credential-suggest-cpm'
- tapOn: {id: 'credential-input'}
- inputText: 'NARM'
- tapOn: {id: 'credential-add-btn'}
- waitForAnimationToEnd: {timeout: 2500}
- takeScreenshot: tjb-midwife-cred-chips
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'I already have an account'
    timeout: 20000
- tapOn: 'I already have an account'
- waitForAnimationToEnd: {timeout: 3000}
- tapOn: {text: 'Email'}
- inputText: 'demo.midwife@truejoybirthing.com'
- tapOn: {id: 'login-password-input'}
- inputText: 'DemoMidwife2024!'
- tapOn: {id: 'login-submit-btn'}
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    timeout: 15000
    visible: 'Hello, Emily'
- takeScreenshot: midwife-restored-final